<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090F">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>[1447-1448] دليل أرقام دعاة الإسلام — Islam Dawah Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090F;
  --champagne:#E7C89A;
  --champagne-dim:#9E8862;
  --accent-hi:#F4E0C0;   /* أعلى تدرّج زر الإجراء */
  --accent-ink:#241A0B;  /* لون النص فوق زر الإجراء */
  --jade:#63D9B4;
  --text:#F0F2F6;
  --text-2:#9AA3B4;
  --text-3:#5F6879;
  --glass-1:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.018);
  --edge:rgba(255,255,255,.09);
  --edge-lit:rgba(231,200,154,.38);
  --r-lg:26px; --r-md:20px; --r-sm:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  font-size:16px;line-height:1.6;overflow-x:hidden;padding-bottom:46px;
}
html[lang=en] body{font-family:"Readex Pro",system-ui,sans-serif}

.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aura i{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5}
.aura i:nth-child(1){width:70vw;height:70vw;top:-24vw;inset-inline-end:-18vw;
  background:radial-gradient(circle,#1E2A55,transparent 68%)}
.aura i:nth-child(2){width:60vw;height:60vw;bottom:-18vw;inset-inline-start:-16vw;
  background:radial-gradient(circle,#123A34,transparent 70%)}
.aura i:nth-child(3){width:44vw;height:44vw;top:34%;inset-inline-start:24%;
  background:radial-gradient(circle,#3A2A16,transparent 72%);opacity:.34}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* ── شاشة الدخول ── */
.splash{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  padding:34px 22px;background:var(--bg);overflow:hidden;
  transition:opacity .5s ease,visibility .5s}
body[data-splash="0"] .splash{opacity:0;visibility:hidden;pointer-events:none}
body[data-splash="1"]{overflow:hidden}

/* هالات ضوء خلف المحتوى */
.sp-glow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp-glow i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;
  animation:drift 22s ease-in-out infinite}
.sp-glow i:nth-child(1){width:62vw;height:62vw;top:-14%;inset-inline-start:-18%;
  background:var(--a1)}
.sp-glow i:nth-child(2){width:54vw;height:54vw;bottom:-12%;inset-inline-end:-16%;
  background:var(--a2);animation-delay:-8s}
.sp-glow i:nth-child(3){width:44vw;height:44vw;top:38%;inset-inline-end:26%;
  background:var(--a3);animation-delay:-15s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(4%,-5%) scale(1.14)}}

.splash-in{position:relative;width:100%;max-width:430px;text-align:center;
  animation:rise .8s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* الشعار: نجمة ثمانية وحلقات تنبعث */
.sp-mark{position:relative;width:128px;height:128px;margin:0 auto 22px}
.sp-mark svg{position:absolute;inset:0;width:100%;height:100%}
.sp-star{animation:spin 64s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--champagne);
  opacity:0;animation:emit 3.6s cubic-bezier(.2,.6,.3,1) infinite}
.sp-ring:nth-child(2){animation-delay:1.2s}
.sp-ring:nth-child(3){animation-delay:2.4s}
@keyframes emit{0%{transform:scale(.62);opacity:.55}
  70%{opacity:.12}100%{transform:scale(1.5);opacity:0}}

.splash h1{font-family:"Readex Pro",sans-serif;font-weight:600;font-size:27px;line-height:1.5;
  background:linear-gradient(100deg,var(--text) 6%,var(--champagne) 94%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sp-tag{margin-top:9px;font-size:13px;color:var(--text-3);letter-spacing:.02em}
.sp-ver{display:inline-block;margin-top:13px;padding:5px 14px;border-radius:999px;
  font-size:11.5px;color:var(--champagne);border:1px solid var(--edge-lit)}

/* أرقام حيّة */
.sp-stats{display:flex;justify-content:center;gap:9px;margin-top:22px}
.sp-stat{flex:1;max-width:118px;padding:12px 6px;border-radius:16px;
  background:var(--glass-2);border:1px solid var(--edge)}
.sp-stat b{display:block;font-size:21px;font-weight:600;color:var(--champagne);
  font-variant-numeric:tabular-nums;line-height:1.2}
.sp-stat span{display:block;margin-top:4px;font-size:10.5px;color:var(--text-3)}

.sp-msg{margin-top:22px;padding:17px 16px;border-radius:var(--r-lg);text-align:start;
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));border:1px solid var(--edge)}
.sp-msg p{font-size:13px;line-height:1.95;color:var(--text-2)}
.sp-msg .hi{display:block;margin-top:10px;color:var(--champagne);font-weight:600}

.sp-btn{position:relative;overflow:hidden;width:100%;margin-top:20px;padding:16px;cursor:pointer;
  font-family:inherit;font-size:15.5px;font-weight:600;border:0;border-radius:var(--r-md);
  background:linear-gradient(150deg,var(--accent-hi),var(--champagne));color:var(--accent-ink)}
.sp-btn::after{content:"";position:absolute;top:0;bottom:0;width:38%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%{inset-inline-start:-45%}55%,100%{inset-inline-start:115%}}
.sp-btn:active{transform:scale(.985)}
.sp-share{width:100%;margin-top:10px;padding:14px;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:600;border-radius:var(--r-md);
  background:rgba(99,217,180,.08);border:1px solid rgba(99,217,180,.3);color:var(--jade)}
.sp-waqf{margin-top:20px;font-size:11px;line-height:1.8;color:var(--text-3)}

@media (prefers-reduced-motion:reduce){
  .sp-glow i,.sp-star,.sp-ring,.sp-btn::after,.splash-in{animation:none}
  .sp-ring{opacity:.16}
}
@media (max-height:680px){
  .sp-mark{width:96px;height:96px;margin-bottom:16px}
  .splash h1{font-size:23px}
  .sp-msg{margin-top:16px;padding:14px}
  .sp-stats{margin-top:16px}
}

/* ── top bar ── */
.bar{position:sticky;top:0;z-index:40;background:rgba(7,9,15,.62);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.06)}
.bar-in{display:flex;align-items:center;gap:8px;padding:13px 0}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.tbadge{flex:0 0 auto;font-size:9.5px;font-weight:600;letter-spacing:.02em;line-height:1;
  padding:4px 8px;border-radius:999px;white-space:nowrap;
  color:var(--accent-ink);background:var(--champagne)}
.flagsbtn{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:8px 10px;cursor:pointer;
  border-radius:999px;background:rgba(224,138,106,.1);border:1px solid rgba(224,138,106,.38);
  color:#E08A6A;font-family:inherit}
.flagsbtn[hidden]{display:none}
.flagsbtn svg{width:15px;height:15px}
.flagsbtn b{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* سطر التنبيه المطويّ */
.flagd{margin-top:14px;border-radius:14px;overflow:hidden;
  background:rgba(224,138,106,.07);border:1px solid rgba(224,138,106,.3)}
.flagd summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:12.5px;
  line-height:1.65;color:#E08A6A;display:flex;align-items:center;gap:8px}
.flagd summary::-webkit-details-marker{display:none}
.flagd summary::after{content:"+";margin-inline-start:auto;font-size:15px;opacity:.7}
.flagd[open] summary::after{content:"\2212"}
.flagd p{padding:0 14px 13px;font-size:12px;line-height:1.9;color:var(--text-2)}

.langbtn{flex:0 0 auto;min-width:42px;padding:9px 10px;cursor:pointer;font-family:inherit;
  font-size:11.5px;font-weight:600;letter-spacing:.05em;border-radius:999px;
  background:var(--glass-1);border:1px solid var(--edge);color:var(--text-2)}
.back{flex:0 0 auto;width:40px;height:40px;display:none;place-items:center;cursor:pointer;
  border-radius:13px;background:var(--glass-1);border:1px solid var(--edge);color:var(--text-2)}
.back svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
html[dir=rtl] .back svg{transform:scaleX(-1)}
body[data-nested="1"] .back{display:grid}
.brand{flex:1;min-width:0}
.brand h1{font-family:"Readex Pro",sans-serif;font-weight:600;font-size:16px;line-height:1.3;
  letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(100deg,#FFF 12%,var(--champagne) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{font-size:11px;color:var(--text-3);margin-top:1px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{display:flex;flex:0 0 auto;padding:3px;gap:2px;border-radius:999px;
  background:var(--glass-1);border:1px solid var(--edge)}
.toggle button{font-family:inherit;font-size:11.5px;font-weight:600;letter-spacing:.04em;
  padding:6px 9px;border:0;border-radius:999px;background:transparent;color:var(--text-3);cursor:pointer}
.toggle button[aria-pressed=true]{background:linear-gradient(150deg,var(--accent-hi),var(--champagne));color:var(--accent-ink)}

/* ── search ── */
.search{position:relative;margin:14px 0 2px}
.search input{width:100%;font-family:inherit;font-size:15px;color:var(--text);
  padding:13px 44px 13px 15px;border-radius:var(--r-md);
  background:linear-gradient(150deg,var(--glass-1),var(--glass-2));
  border:1px solid var(--edge);-webkit-appearance:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;border-color:var(--edge-lit);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 3px rgba(231,200,154,.09)}
.search svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2;pointer-events:none}
body[data-stage="detail"] .search{display:none}

.meta{font-size:11.5px;color:var(--text-3);padding:12px 3px 2px;letter-spacing:.03em}
.grid{display:grid;gap:10px;margin-top:6px}

/* ── stage 1 · language tiles ── */
.lang-grid{grid-template-columns:repeat(auto-fill,minmax(102px,1fr))}
.tile{position:relative;overflow:hidden;text-align:start;cursor:pointer;font-family:inherit;color:inherit;
  padding:15px 13px 14px;border-radius:var(--r-md);
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 8px 22px rgba(0,0,0,.34)}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;
  background:radial-gradient(120% 90% at 50% 0%,rgba(231,200,154,.14),transparent 62%)}
.tile .glyph{display:block;font-size:23px;line-height:1.2;color:var(--champagne);
  direction:ltr;unicode-bidi:isolate;text-shadow:0 0 24px rgba(231,200,154,.34);min-height:29px}
.tile .ar{display:block;font-size:13.5px;font-weight:600;margin-top:9px;line-height:1.35}
.tile .en{display:block;font-family:"Readex Pro",sans-serif;font-weight:300;font-size:10.5px;
  color:var(--text-2);margin-top:1px;direction:ltr;unicode-bidi:isolate;text-align:start}
.tile .cnt{position:absolute;top:11px;inset-inline-end:11px;font-size:10px;line-height:1;
  color:var(--champagne-dim);border:1px solid rgba(231,200,154,.2);border-radius:999px;padding:3px 7px}

/* ── stage 2 · person chips ── */
.people-grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.chip{position:relative;text-align:start;cursor:pointer;font-family:inherit;color:inherit;
  padding:15px 14px;border-radius:var(--r-md);
  background:linear-gradient(155deg,rgba(255,255,255,.058),rgba(255,255,255,.016));
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px rgba(0,0,0,.3)}
.chip b{display:block;font-size:14.5px;font-weight:600;line-height:1.4}
.chip span{display:block;font-size:10.5px;color:var(--text-3);margin-top:4px;line-height:1.45}
.chip em{display:block;font-style:normal;font-size:10px;color:var(--champagne-dim);margin-top:6px}

/* ── stage header ── */
.head{display:flex;align-items:center;gap:13px;margin:16px 0 2px}
.head .glyph{font-size:28px;color:var(--champagne);direction:ltr;unicode-bidi:isolate;
  text-shadow:0 0 26px rgba(231,200,154,.3);line-height:1}
.head .t{min-width:0}
.head .t b{display:block;font-size:17px;font-weight:600;line-height:1.3}
.head .t span{display:block;font-family:"Readex Pro",sans-serif;font-weight:300;font-size:11.5px;
  color:var(--text-3);direction:ltr;unicode-bidi:isolate;text-align:start}

/* ── stage 3 · detail ── */
.detail{position:relative;overflow:hidden;margin-top:16px;padding:26px 22px 22px;
  border-radius:var(--r-lg);
  background:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 44px rgba(0,0,0,.45)}
.detail::before{content:"";position:absolute;top:0;inset-inline-start:26px;inset-inline-end:26px;
  height:1px;background:linear-gradient(90deg,transparent,rgba(231,200,154,.5),transparent)}
.detail .mark{position:absolute;top:-6px;inset-inline-end:14px;font-size:74px;line-height:1;
  color:rgba(231,200,154,.07);direction:ltr;unicode-bidi:isolate;pointer-events:none;user-select:none}
.detail h2{font-size:25px;font-weight:600;line-height:1.3;letter-spacing:-.01em;position:relative}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.tag{font-size:11.5px;padding:4px 11px;border-radius:999px;color:var(--champagne);
  background:rgba(231,200,154,.07);border:1px solid rgba(231,200,154,.18)}
.detail .org{font-size:12.5px;color:var(--text-2);margin-top:14px;line-height:1.55}
.detail .num{font-variant-numeric:tabular-nums;letter-spacing:.13em;font-size:23px;font-weight:600;
  color:var(--text);margin-top:16px;direction:ltr;unicode-bidi:isolate;text-align:start}
.detail .flag{font-size:11.5px;line-height:1.7;color:#D9B87C;background:rgba(231,200,154,.07);
  border:1px solid rgba(231,200,154,.16);border-radius:12px;padding:9px 12px;margin-top:14px}
.acts{display:flex;gap:10px;margin-top:20px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;
  font-size:14.5px;font-weight:600;text-decoration:none;cursor:pointer;padding:15px 10px;
  border-radius:var(--r-sm);border:1px solid transparent}
.act svg{width:16px;height:16px;flex:0 0 auto}
.act-call{background:linear-gradient(150deg,var(--accent-hi),var(--champagne));color:var(--accent-ink);
  box-shadow:0 8px 22px rgba(231,200,154,.18)}
.act-wa{background:rgba(99,217,180,.08);border-color:rgba(99,217,180,.26);color:var(--jade)}
.act-ghost{margin-top:10px;width:100%;background:var(--glass-1);border-color:var(--edge);
  color:var(--text-2);font-size:13.5px;padding:13px}
.act-ghost.done{color:var(--jade);border-color:rgba(99,217,180,.26)}
.via{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:var(--text-3)}
.via a{color:var(--champagne);text-decoration:none;font-variant-numeric:tabular-nums;
  letter-spacing:.06em;direction:ltr;unicode-bidi:isolate;white-space:nowrap}

/* ── societies screen ── */
.orow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;
  margin-top:9px;border-radius:var(--r-md);font-size:13.5px;
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));border:1px solid var(--edge)}
.orow{text-decoration:none;color:var(--text)}
.orow>span:first-child{flex:1;min-width:0;line-height:1.6}
.orow a,.orow .ourl{color:var(--champagne);text-decoration:none;font-variant-numeric:tabular-nums;
  letter-spacing:.06em;direction:ltr;unicode-bidi:isolate;white-space:nowrap;flex:0 0 auto}
.link{display:block;width:100%;margin-top:22px;padding:15px;text-align:center;cursor:pointer;
  font-family:inherit;font-size:13px;color:var(--text-3);border-radius:var(--r-md);
  background:transparent;border:1px dashed rgba(255,255,255,.11)}
.empty{text-align:center;padding:52px 22px;color:var(--text-3);font-size:14px;
  border:1px dashed rgba(255,255,255,.1);border-radius:var(--r-md);margin-top:16px}
footer{margin-top:24px;font-size:11px;line-height:1.9;color:var(--text-3)}

@media (min-width:560px){
  .lang-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .tile{padding:19px 17px 17px} .tile .glyph{font-size:30px;min-height:36px}
  .people-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .brand h1{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){
  .tile,.chip,.act,.back,.orow{transition:transform .2s cubic-bezier(.2,.7,.3,1),border-color .25s,box-shadow .25s}
  .tile::after{transition:opacity .25s}
  .tile:hover,.chip:hover{transform:translateY(-3px);border-color:var(--edge-lit)}
  .tile:hover::after{opacity:1}
  .tile:active,.chip:active{transform:scale(.97)}
  .act:active,.back:active{transform:scale(.96)}
  .enter>*{animation:rise .4s cubic-bezier(.22,.8,.3,1) backwards}
  .enter>*:nth-child(1){animation-delay:.02s}.enter>*:nth-child(2){animation-delay:.045s}
  .enter>*:nth-child(3){animation-delay:.07s}.enter>*:nth-child(4){animation-delay:.095s}
  .enter>*:nth-child(5){animation-delay:.12s}.enter>*:nth-child(6){animation-delay:.145s}
  .enter>*:nth-child(n+7){animation-delay:.17s}
  .detail{animation:rise .42s cubic-bezier(.22,.8,.3,1) backwards}
}
@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}

.badge{display:inline-block;font-size:9.5px;letter-spacing:.04em;padding:2px 7px;border-radius:999px;
  color:#F0B6D0;background:rgba(240,182,208,.09);border:1px solid rgba(240,182,208,.22);margin-inline-start:6px}
.filters{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font-family:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;
  background:var(--glass-1);border:1px solid var(--edge);color:var(--text-3);white-space:nowrap}
.fchip[aria-pressed=true]{background:rgba(231,200,154,.13);border-color:var(--edge-lit);color:var(--champagne)}
.more{display:block;width:100%;margin-top:12px;padding:15px;cursor:pointer;font-family:inherit;
  font-size:13.5px;font-weight:600;color:var(--champagne);border-radius:var(--r-md);
  background:var(--glass-1);border:1px solid var(--edge)}
.aka{font-size:11.5px;color:var(--text-3);margin-top:7px;line-height:1.5}
.detail .orgs-list{margin-top:14px}
.detail .orgs-list div{font-size:12.5px;color:var(--text-2);line-height:1.7;
  padding-inline-start:13px;position:relative}
.detail .orgs-list div::before{content:"";position:absolute;inset-inline-start:0;top:11px;
  width:4px;height:4px;border-radius:50%;background:var(--champagne-dim)}
.alt{margin-top:10px;font-size:12px;color:var(--text-3)}
.alt a{color:var(--champagne);text-decoration:none;direction:ltr;unicode-bidi:isolate;
  font-variant-numeric:tabular-nums;letter-spacing:.06em}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;
  padding-top:13px;border-top:1px solid rgba(255,255,255,.06)}
.upd{font-size:11px;color:var(--text-3);line-height:1.5}
.report{flex:0 0 auto;font-size:11.5px;font-weight:600;text-decoration:none;color:#D9B87C;
  border:1px solid rgba(231,200,154,.22);border-radius:999px;padding:6px 12px;white-space:nowrap}

/* ── tabs ── */
.tabs{display:flex;gap:6px;padding:4px;margin-top:14px;border-radius:999px;
  background:var(--glass-1);border:1px solid var(--edge);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 11px;
  white-space:nowrap;
  border:0;border-radius:999px;background:transparent;color:var(--text-3);cursor:pointer}
.tabs button[aria-pressed=true]{background:linear-gradient(150deg,var(--accent-hi),var(--champagne));color:var(--accent-ink)}
.region{font-family:"Readex Pro",sans-serif;font-weight:400;font-size:11.5px;letter-spacing:.09em;
  color:var(--champagne-dim);margin:22px 3px 8px;display:flex;align-items:center;gap:10px}
.region::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(231,200,154,.24),transparent)}
.tile.plain .ar{margin-top:0!important}
.tile.plain{padding-top:16px}

/* ── الخلايا المضغوطة ── */
.nat-grid{grid-template-columns:repeat(3,1fr);gap:8px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;min-height:84px;padding:22px 7px 11px;cursor:pointer;font-family:inherit;color:inherit;
  border-radius:14px;text-align:center;
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cell .cf{display:flex;gap:4px}
.cell .cf .fg{width:23px;height:15px}
.cell .cn{font-size:12.5px;font-weight:600;line-height:1.35;hyphens:auto}
.cell .sub{font-size:10px;color:var(--text-3)}
.cell .cc{position:absolute;top:6px;inset-inline-end:8px;z-index:1;font-size:9.5px;line-height:1;
  color:var(--champagne-dim);border:1px solid rgba(231,200,154,.2);border-radius:999px;padding:3px 6px}
.cell.wide{min-height:78px}
.region{display:flex;align-items:center;gap:9px;margin:20px 3px 9px}
.region b{font-weight:400;font-size:10.5px;color:var(--text-3);
  border:1px solid var(--edge);border-radius:999px;padding:2px 8px}
@media (prefers-reduced-motion:no-preference){
  .cell{transition:transform .18s,border-color .22s}
  .cell:hover{border-color:var(--edge-lit)} .cell:active{transform:scale(.96)}
}
@media (min-width:480px){ .nat-grid{grid-template-columns:repeat(4,1fr)} }
@media (min-width:720px){ .nat-grid{grid-template-columns:repeat(6,1fr)} }
.orgtile{display:block;text-decoration:none;color:inherit}
.orgtile b{font-size:13.5px;line-height:1.45;padding-inline-end:0!important}
.onum{display:block;margin-top:9px;font-size:13px;font-weight:600;color:var(--champagne);
  font-variant-numeric:tabular-nums;letter-spacing:.07em;direction:ltr;unicode-bidi:isolate;text-align:start}

/* ── flag-led language identity ── */
.fg{display:inline-block;vertical-align:middle;border-radius:2.5px;
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 3px 8px rgba(0,0,0,.5)}
.flag-row{display:flex;gap:6px;align-items:center}
.flag-row .fg{width:30px;height:20px}
.tile .glyph{font-size:11.5px!important;line-height:1.5;min-height:0!important;margin-top:9px!important;
  font-weight:500;opacity:.82;text-shadow:none!important;letter-spacing:.01em}
.tile .ar{margin-top:11px!important}
.head .flag-row .fg{width:34px;height:23px}
.detail .mark{display:none}
.detail .flag-row{margin-bottom:12px}.detail .flag-row .fg{width:28px;height:19px}
.tag .fg{width:15px;height:10px;margin-inline-end:6px}
.chip .flags{position:absolute;top:13px;inset-inline-end:13px;display:flex;gap:3px}
.chip .flags .fg{width:16px;height:11px}
.chip b{padding-inline-end:42px}

/* ── ضبط الشبكات ومنع انهيار الأعمدة ── */
.grid>*{min-width:0;overflow-wrap:anywhere}
.people-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px}
.org-grid{grid-template-columns:repeat(2,1fr);gap:8px}
.cell.org{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  text-align:start;gap:6px;min-height:74px;padding:11px 11px;text-decoration:none}
.cell.org .cn{font-size:12.5px;line-height:1.45;font-weight:600}
.cell.org .onum{font-size:12.5px;font-weight:600;color:var(--champagne);
  font-variant-numeric:tabular-nums;letter-spacing:.06em;direction:ltr;unicode-bidi:isolate}

/* ── بطاقة الشخص المضغوطة ── */
.pcard{border-radius:14px;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  min-height:88px;padding:10px 11px;cursor:pointer;font-family:inherit;color:inherit;
  text-align:start;border-radius:16px;
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.pcard .pflags{display:flex;gap:3px}
.pcard .pflags .fg{width:15px;height:10px}
.pcard .pname{font-size:12.5px;font-weight:600;line-height:1.35}
.pcard .porg{font-size:9.5px;color:var(--text-3);line-height:1.4;margin-top:auto}
.pcard .pw{font-size:9.5px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;
  color:#F0B6D0;background:rgba(240,182,208,.09);border:1px solid rgba(240,182,208,.22)}
.pcard:active{transform:scale(.97)}
.pcard{transition:transform .18s,border-color .22s}
.pcard:hover{border-color:var(--edge-lit)}

/* ── منع التجاوز الأفقي الذي كان يقصّ العنوان ── */
html{overflow-x:hidden;width:100%}
body{width:100%;max-width:100%}
.wrap{width:100%}
.bar-in>*{min-width:0}
@media (min-width:520px){ .people-grid{grid-template-columns:repeat(3,1fr)!important}
  .org-grid{grid-template-columns:repeat(3,1fr)} }
@media (min-width:800px){ .people-grid{grid-template-columns:repeat(4,1fr)!important} }

/* ── تبويب اللغات داخل الجنسية: أيقونات ملتفّة بلا تمرير أفقي ── */
.lfilters{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 2px}
.lchip{position:relative;flex:1 1 auto;min-width:78px;max-width:33%;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:19px 8px 9px;border-radius:14px;cursor:pointer;font-family:inherit;
  background:var(--glass-1);border:1px solid var(--edge);color:var(--text-2)}
.lchip .lg{font-size:15px;line-height:1.25;color:var(--champagne-dim);
  direction:ltr;unicode-bidi:isolate;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%}
.lchip .ln{font-size:11px;font-weight:600;line-height:1.3;text-align:center}
.lchip .lc{position:absolute;top:5px;inset-inline-end:6px;z-index:1;font-size:9px;line-height:1;
  color:var(--text-3);border:1px solid var(--edge);border-radius:999px;padding:2px 5px}
.lchip[aria-pressed=true]{background:rgba(231,200,154,.12);border-color:var(--edge-lit);color:var(--text)}
.lchip[aria-pressed=true] .lg{color:var(--champagne)}
.lchip[aria-pressed=true] .lc{color:var(--champagne);border-color:rgba(231,200,154,.35)}
.filters{flex-wrap:wrap;overflow-x:visible}

/* ── رسالة الافتتاح ── */
.intro{margin-top:14px;padding:15px 16px;border-radius:var(--r-lg);
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));
  border:1px solid var(--edge)}
.intro p{font-size:13px;line-height:1.9;color:var(--text-2);margin:0}
.intro .hi{color:var(--champagne);font-weight:600}
.intro button{margin-top:12px;width:100%;padding:12px;cursor:pointer;font-family:inherit;
  font-size:13.5px;font-weight:600;border-radius:var(--r-sm);
  background:var(--glass-1);border:1px solid var(--edge-lit);color:var(--champagne)}

/* ── عبارة الوقف ── */
.waqf{margin-top:26px;padding:18px 16px;border-radius:var(--r-lg);text-align:center;
  background:linear-gradient(155deg,rgba(231,200,154,.055),rgba(231,200,154,.012));
  border:1px solid rgba(231,200,154,.16)}
.waqf .w1{font-family:"Readex Pro",sans-serif;font-weight:400;font-size:13px;line-height:1.75;
  color:var(--champagne)}
.waqf .w2{font-size:11.5px;line-height:1.95;color:var(--text-3);margin-top:8px}
.src{margin-top:16px;font-size:10.5px;line-height:1.85;color:var(--text-3);text-align:center}
.waqf-mini{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);
  font-size:11px;line-height:1.7;color:var(--champagne-dim);text-align:center}

/* ── وضع التحرير ── */
body.editing{padding-bottom:96px}
.editbar{position:fixed;bottom:0;inset-inline:0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(7,9,15,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(231,200,154,.2)}
.editbar .ebc{flex:1;font-size:12px;color:var(--text-3);text-align:center}
.eb{font-family:inherit;font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:12px;
  cursor:pointer;background:var(--glass-1);border:1px solid var(--edge);color:var(--text-2)}
.eb.on{background:rgba(231,200,154,.13);border-color:var(--edge-lit);color:var(--champagne)}
.eb.primary{background:linear-gradient(150deg,var(--accent-hi),var(--champagne));border-color:transparent;color:var(--accent-ink)}
.xbtn{position:absolute;top:5px;inset-inline-start:5px;z-index:2;width:24px;height:24px;
  display:grid;place-items:center;font-size:12px;border-radius:8px;
  background:rgba(220,90,90,.14);border:1px solid rgba(220,90,90,.3);color:#F09090}
.pcard.del{opacity:.42;border-color:rgba(220,90,90,.35)}
.pcard.del .pname{text-decoration:line-through}
.pcard .pyr{position:absolute;top:7px;inset-inline-end:9px;font-size:8.5px;line-height:1;
  color:var(--text-3);font-variant-numeric:tabular-nums}
.pcard .pyr.old{color:#C9903F}

/* ── تبويب سنوات التحديث ── */
.cell.yr .ynum{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:.02em;color:var(--champagne);line-height:1.1}
.cell.yr.stale .ynum{color:#C9903F}
.cell.yr.stale{border-color:rgba(201,144,63,.28)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 2px}
.stats div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;
  border-radius:13px;background:var(--glass-1);border:1px solid var(--edge)}
.stats b{font-size:16px;font-weight:600;color:var(--champagne);font-variant-numeric:tabular-nums}
.stats span{font-size:9.5px;color:var(--text-3)}

/* ── لوحة القائمين ── */
.agrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}
.abox{display:flex;flex-direction:column;gap:4px;padding:14px 12px;border-radius:16px;
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));border:1px solid var(--edge)}
.abox b{font-size:22px;font-weight:600;color:var(--champagne);font-variant-numeric:tabular-nums;line-height:1}
.abox span{font-size:10.5px;color:var(--text-2);line-height:1.4}
.abox em{font-style:normal;font-size:9.5px;color:var(--text-3);line-height:1.65;margin-top:3px}
.cell.org .sub{font-size:9.5px;color:var(--text-3);line-height:1.45}
@media (min-width:560px){ .agrid{grid-template-columns:repeat(3,1fr)} }

/* ── ترقيم الصفحات ── */
.pager{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;margin:12px 0}
.pg{min-width:31px;height:31px;padding:0 8px;font-family:inherit;font-size:12.5px;font-weight:600;
  border-radius:10px;cursor:pointer;background:var(--glass-1);border:1px solid var(--edge);
  color:var(--text-2);font-variant-numeric:tabular-nums}
.pg.on{background:linear-gradient(150deg,var(--accent-hi),var(--champagne));border-color:transparent;color:var(--accent-ink)}
.pg.nav{color:var(--champagne)}
.pgd{color:var(--text-3);font-size:12px;padding:0 2px}
.pgwrap{margin:12px 0}
.pgwrap .pager{margin:7px 0 0}
.pgt{text-align:center;font-size:10.5px;color:var(--text-3);letter-spacing:.02em}
.tabs button{font-size:12px;padding:9px 4px}
.pcard.org{text-decoration:none;justify-content:center;min-height:80px}
.obr{display:block;margin-top:3px;font-size:11px;color:var(--text-3);line-height:1.5}
.orow .ourl{color:var(--champagne);font-variant-numeric:tabular-nums;letter-spacing:.06em;
  direction:ltr;unicode-bidi:isolate;white-space:nowrap}
/* ── المواد: شريط أفقي للأرقام ── */
.rsegs{margin-top:12px}
.rsegs .seg b{font-weight:600;font-size:10.5px;opacity:.7;padding-inline-start:3px}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:11px}
.rtile{display:flex;flex-direction:column;
  padding:13px 13px 11px;border-radius:var(--r-md);
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));border:1px solid var(--edge)}
.rt-name{font-size:14px;font-weight:600;line-height:1.45;color:var(--text)}
.rt-sub{margin-top:4px;font-size:11px;line-height:1.55;color:var(--text-3)}
.rt-num{margin-top:auto;padding-top:9px;font-size:13.5px;font-weight:600;letter-spacing:.07em;
  color:var(--champagne);direction:ltr;unicode-bidi:isolate;text-align:start}
.rt-acts{display:flex;gap:8px;margin-top:10px}
.ib{flex:1;display:grid;place-items:center;height:36px;border-radius:12px;border:1px solid transparent}
.ib svg{width:18px;height:18px}
.ib-call{background:linear-gradient(150deg,var(--accent-hi),var(--champagne));color:var(--accent-ink)}
.ib-wa{background:rgba(99,217,180,.09);border-color:rgba(99,217,180,.3);color:var(--jade)}

/* ── مواقع في صف واحد ── */
.srows{display:grid;gap:7px;margin-top:11px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 13px;border-radius:13px;text-decoration:none;
  background:var(--glass-2);border:1px solid var(--edge)}
.s-nm{flex:1;min-width:0;font-size:12.5px;line-height:1.5;color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-url{flex:0 0 auto;font-size:11.5px;color:var(--champagne);direction:ltr;unicode-bidi:isolate}

/* ── مواد كأقراص ── */
.pnote{margin-top:12px;font-size:11.5px;color:var(--text-3)}
.pill.has{text-decoration:none;color:var(--champagne);border-color:var(--edge-lit)}
.addbtn{width:100%;margin-top:10px}
/* ── ابحث بخطوة ── */
.finder{margin-top:14px;padding:15px 14px 14px;border-radius:var(--r-lg);
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));border:1px solid var(--edge)}
.fd-q{font-size:13px;line-height:1.6;color:var(--text-2);margin-bottom:12px}
.fd-slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fd-slot{grid-column:span 1;text-align:start;padding:11px 12px;cursor:pointer;font-family:inherit;
  border-radius:14px;background:var(--glass-2);border:1px solid var(--edge);color:var(--text)}
.fd-slot.fd-w{grid-column:span 2}
.fd-slot span{display:block;font-size:10px;letter-spacing:.03em;color:var(--text-3)}
.fd-slot b{display:block;margin-top:3px;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd-slot.set{border-color:var(--edge-lit)}
.fd-slot.set b{color:var(--champagne)}
.fd-slot.open{border-color:var(--champagne)}
.fd-panel{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;max-height:206px;overflow-y:auto;
  padding:11px;border-radius:14px;background:var(--glass-2);border:1px solid var(--edge)}
.fd-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;cursor:pointer;
  font-family:inherit;font-size:12px;border-radius:999px;color:var(--text-2);
  background:var(--glass-1);border:1px solid var(--edge)}
.fd-opt.on{background:var(--champagne);border-color:transparent;color:var(--accent-ink)}
.fd-opt em{font-style:normal;font-size:10px;opacity:.65}
.fd-bar{display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--edge)}
.fd-bar b{font-size:19px;font-weight:600;color:var(--champagne);font-variant-numeric:tabular-nums}
.fd-bar span{flex:1;font-size:12px;color:var(--text-3)}
.fd-clear{padding:7px 13px;cursor:pointer;font-family:inherit;font-size:11.5px;
  border-radius:999px;background:transparent;border:1px solid var(--edge);color:var(--text-3)}

.sugg{display:grid;gap:7px;margin-top:12px}
.sug{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;
  text-decoration:none;background:var(--glass-2);border:1px solid var(--edge-lit)}
.sg-k{flex:0 0 auto;font-size:10px;letter-spacing:.03em;color:var(--text-3);
  padding:3px 8px;border-radius:999px;background:var(--glass-1);border:1px solid var(--edge)}
.sg-n{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--champagne);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-c{flex:0 0 auto;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.hostbox{margin-top:14px;padding:14px 14px;border-radius:16px;
  background:var(--glass-2);border:1px dashed var(--edge-lit)}
.hostbox .hb-t{font-size:12.5px;font-weight:600;color:var(--champagne);margin-bottom:6px}
.hostbox p{font-size:11.5px;line-height:1.9;color:var(--text-3)}
.fq{display:grid;gap:9px;margin-top:12px}
.fqi{display:block;padding:14px 14px;border-radius:var(--r-md);text-decoration:none;
  background:linear-gradient(155deg,var(--glass-1),var(--glass-2));border:1px solid var(--edge)}
.fq-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fq-h b{font-size:14.5px;font-weight:600;color:var(--text)}
.fq-h em{font-style:normal;font-size:12px;color:var(--champagne);
  direction:ltr;unicode-bidi:isolate}
.fq-n{display:block;margin-top:7px;font-size:11.5px;line-height:1.8;color:var(--text-2)}
.fq-a{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--edge)}
.fq-a b{font-size:13.5px;color:var(--champagne);direction:ltr;unicode-bidi:isolate}
.fq-ok{font-family:inherit;font-size:12px;font-weight:600;padding:8px 15px;border-radius:11px;
  cursor:pointer;border:0;background:var(--glass-1);border:1px solid var(--edge-lit);
  color:var(--champagne)}
.rtile{position:relative}
.rt-ed{position:absolute;top:8px;inset-inline-end:8px}
.rtile .rt-name{padding-inline-end:22px}
.shint{margin-top:7px;font-size:11px;line-height:1.75;color:var(--text-3)}
.srow .pedit{flex:0 0 auto}
.pedit{display:grid;place-items:center;width:19px;height:19px;margin-inline-start:2px;
  font-size:11px;font-weight:400;border-radius:50%;cursor:pointer;
  background:var(--glass-1);border:1px solid var(--edge);color:var(--text-3)}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;
  font-size:12px;line-height:1.4;color:var(--text-2);
  background:var(--glass-2);border:1px solid var(--edge)}
.pill i{font-style:normal;font-size:9.5px;letter-spacing:.04em;color:var(--text-3);
  padding-inline-start:7px;border-inline-start:1px solid var(--edge)}

/* ══════════ زر ولوحة الإعدادات ══════════ */
.gear{flex:0 0 auto;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;
  border-radius:12px;background:var(--glass-1);border:1px solid var(--edge);color:var(--text-2)}
.gear svg{width:17px;height:17px}
.sheet{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.sheet.open{display:flex}
.sheetbox{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  padding:18px 16px calc(22px + env(safe-area-inset-bottom));
  border-radius:24px 24px 0 0;background:var(--bg);border:1px solid var(--edge);
  border-bottom:0;box-shadow:0 -18px 50px rgba(0,0,0,.5)}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheethead b{font-family:"Readex Pro",sans-serif;font-size:16px;color:var(--champagne)}
.sx{width:30px;height:30px;border-radius:10px;cursor:pointer;font-size:13px;
  background:var(--glass-1);border:1px solid var(--edge);color:var(--text-2)}
.slab{font-size:11px;color:var(--text-3);margin:16px 2px 8px;letter-spacing:.04em}
.shint{font-size:10.5px;color:var(--text-3);margin-top:8px;line-height:1.7}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px;cursor:pointer;
  border-radius:14px;font-family:inherit;background:var(--glass-1);border:1px solid var(--edge)}
.sw.on{border-color:var(--edge-lit);background:var(--glass-2)}
.swp{width:100%;height:26px;border-radius:8px;border:1px solid rgba(128,128,128,.25)}
.swn{font-size:9.5px;color:var(--text-2)}
.swp.t-auto{background:linear-gradient(135deg,#0C1424 45%,#E9EEF6)}
.swp.t-obsidian{background:linear-gradient(135deg,#07090F 45%,#E7C89A)}
.swp.t-midnight{background:linear-gradient(135deg,#060912 45%,#8FC3F5)}
.swp.t-forest{background:linear-gradient(135deg,#050C09 45%,#D9C287)}
.swp.t-plum{background:linear-gradient(135deg,#0B0710 45%,#E2A9C4)}
.swp.t-paper{background:linear-gradient(135deg,#F5F2EC 45%,#1F6B4F)}
.swp.t-sand{background:linear-gradient(135deg,#F3EDE2 45%,#8A5A24)}
.swp.t-mint{background:linear-gradient(135deg,#F2F7F6 45%,#0E6E63)}
.swp.t-slate{background:linear-gradient(135deg,#EEF1F5 45%,#274B87)}
.swp.t-petrol{background:linear-gradient(135deg,#04151A 45%,#3FD0C9)}
.swp.t-azure{background:linear-gradient(135deg,#03101F 45%,#4CC9F0)}
.swp.t-lagoon{background:linear-gradient(135deg,#EAF3F3 45%,#0B6B72)}
.swp.t-denim{background:linear-gradient(135deg,#EDF2F9 45%,#1D5AA8)}
.segs{display:flex;gap:7px}
.seg{flex:1;padding:10px 4px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  border-radius:12px;background:var(--glass-1);border:1px solid var(--edge);color:var(--text-2)}
.seg.on{background:var(--champagne);border-color:transparent;color:var(--accent-ink)}
.sbtn{display:block;width:100%;margin-top:9px;padding:13px;font-family:inherit;font-size:13.5px;
  font-weight:600;cursor:pointer;border-radius:14px;
  background:var(--glass-1);border:1px solid var(--edge);color:var(--text-2)}
.sbtn.primary{background:var(--champagne);border-color:transparent;color:var(--accent-ink)}
.fin{width:100%;margin-top:9px;padding:13px 14px;font-family:inherit;font-size:15px;
  border-radius:14px;background:var(--glass-1);border:1px solid var(--edge);color:var(--text);
  -webkit-appearance:none}
.fin:focus{outline:none;border-color:var(--edge-lit)}
.fchk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:var(--text-2)}
.ferr{min-height:16px;margin-top:9px;font-size:11.5px;color:#F09090}
.lchip.on{background:rgba(231,200,154,.14);border-color:var(--edge-lit);color:var(--text)}
:focus-visible{outline:2px solid var(--champagne);outline-offset:3px;border-radius:6px}

const LANG2CO = (() => {
  const map = {};
  Object.entries(DATA.CO).forEach(([code,o]) =>
    (o.l||[]).forEach(k => (map[k] = map[k] || []).push(code)));
  return map;
})();
const REGOF = {};
(DATA.REG||[]).forEach(rg => (rg.c||[]).forEach(i => REGOF[i] = rg));

const HAY = D.map(d => {
  const parts = [d.n, d.e, (d.aka||[]).join(" "), d.o.join(" "), d.oe.join(" ")];
  d.l.forEach(k => { const o=L[k]; if(o) parts.push(o.ar, o.en, o.g); });
  (d.ci||[]).forEach(i => {
    const c = DATA.CITIES[i]; if(c) parts.push(c.ar, c.en);
    const rg = REGOF[i];      if(rg) parts.push(rg.ar, rg.en);
  });
  const seen = new Set();
  d.l.forEach(k => (LANG2CO[k]||[]).forEach(code => {
    if(seen.has(code)) return; seen.add(code);
    const o = DATA.CO[code]; if(o) parts.push(o.ar, o.en);
  }));
  return norm(parts.join(" "));
});

function matches(d){
  if(!EDIT && DEL.has(d.p)) return false;
  if(EDIT && onlyOld && d.y > new Date().getFullYear()-2) return false;
  if(!q.trim()) return true;
  const dg=q.replace(/\D/g,"");
  if(dg&&d.p.includes(dg)) return true;
  const i=D.indexOf(d);
  return (i>=0?HAY[i]:"").includes(norm(q));
}
function route(){
  const h=location.hash.replace(/^#\/?/,"").split("/");
  if(h[0]==="regions"||h[0]==="cities") return {stage:"home",tab:"city"};
  if(h[0]==="years") return {stage:"home",tab:"year"};
  if(h[0]==="y"){ const hj=/h$/.test(h[1]||""), v=+String(h[1]).replace(/h$/,"");
    if((hj?DATA.YEARSH:DATA.YEARS).some(x=>x.y===v)) return {stage:"year",y:v,hj:hj}; }
  if(h[0]==="reg"&&DATA.REG.some(x=>x.id===h[1])) return {stage:"region",id:h[1]};
  if(h[0]==="city"&&DATA.CITIES[+h[1]]) return {stage:"city",i:+h[1]};
  if(h[0]==="co"&&DATA.CO[h[1]]) return {stage:"country",code:h[1]};
  if(h[0]==="l"&&L[h[1]]) return {stage:"lang",key:h[1]};
  if(h[0]==="p"&&D[+h[1]]) return {stage:"detail",i:+h[1]};
  if(h[0]==="orgs") return {stage:"home",tab:"org"};
  if(h[0]==="res") return {stage:"home",tab:"res"};
  if(h[0]==="oc"&&DATA.ORGC[+h[1]]) return {stage:"orgcity",i:+h[1]};
  if(h[0]==="flags") return {stage:"flags"};
  if(h[0]==="admin"&&EDIT) return {stage:"admin"};
  return {stage:"home"};
}

function pager(total){
  const n=Math.ceil(total/PSIZE); if(n<2) return "";
  const btn=i=>'<button class="pg'+(i===page?" on":"")+'" data-pg="'+i+'">'+i+'</button>';
  let mid=[];
  if(n<=7){ for(let i=1;i<=n;i++) mid.push(btn(i)); }
  else{
    mid.push(btn(1));
    const s=Math.max(2,page-1), e=Math.min(n-1,page+1);
    if(s>2) mid.push('<span class="pgd">\u2026</span>');
    for(let i=s;i<=e;i++) mid.push(btn(i));
    if(e<n-1) mid.push('<span class="pgd">\u2026</span>');
    mid.push(btn(n));
  }
  return '<div class="pgwrap"><p class="pgt">'+T[ui].pageOf(page,n,total)+'</p>'+
    '<div class="pager"><button class="pg nav" data-pg="'+Math.max(1,page-1)+'">\u2039</button>'+
    mid.join("")+'<button class="pg nav" data-pg="'+Math.min(n,page+1)+'">\u203a</button></div></div>';
}
function listBlock(rows, render1){
  if(!rows.length) return '<p class="empty">'+T[ui].none+'</p>';
  const n=Math.ceil(rows.length/PSIZE);
  if(page>n) page=n;
  const shown=rows.slice((page-1)*PSIZE, page*PSIZE);
  const p=pager(rows.length);
  return p+'<div class="grid people-grid enter">'+shown.map(render1).join("")+'</div>'+p;
}

function normPhone(v){
  let s=String(v||"").replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-0x0660)
                     .replace(/[^\d+]/g,"");
  if(s.startsWith("+966")) s="0"+s.slice(4);
  else if(s.startsWith("966")) s="0"+s.slice(3);
  else if(s.startsWith("5")&&s.length===9) s="0"+s;
  return /^05\d{8}$/.test(s) ? s : null;
}

function resKind(k){
  if(ui==="ar") return k;
  if(RESKIND[k]) return RESKIND[k];
  const mm=k.match(/(\d+|[\u0660-\u0669]+)/);
  const west=mm?String(mm[0]).replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-0x0660):"";
  return west ? "Dawah text in English \u2014 "+west+" paragraphs" : k;
}

function suggest(){
  const t=T[ui], nq=norm(q);
  if(nq.length<2) return "";
  const hit=(a,bb)=>norm(a).includes(nq)||norm(bb||"").includes(nq);
  const out=[];
  Object.entries(DATA.CO).forEach(([code,o])=>{
    if(hit(o.ar,o.en)) out.push([t.sgNat, o[ui], o.n, "#/co/"+code]); });
  (DATA.REG||[]).forEach(rg=>{
    if(hit(rg.ar,rg.en)) out.push([t.sgReg, rg[ui], rg.n, "#/reg/"+rg.id]); });
  DATA.CITIES.forEach((c,i)=>{
    if(hit(c.ar,c.en)&&c.n) out.push([t.sgCity, c[ui], c.n, "#/city/"+i]); });
  Object.entries(L).forEach(([k,o])=>{
    if(COUNT[k]&&(hit(o.ar,o.en)||hit(o.g,""))) out.push([t.sgLang, o[ui], COUNT[k], "#/l/"+k]); });
  if(!out.length) return "";
  return '<div class="sugg">'+out.slice(0,6).map(s=>
    '<a class="sug" href="'+s[3]+'"><span class="sg-k">'+esc(s[0])+'</span>'+
    '<span class="sg-n">'+esc(s[1])+'</span><span class="sg-c">'+s[2]+'</span></a>').join("")+'</div>';
}

function prefersDark(){
  try{ return matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){ return true; }
}
function resolvedTheme(){
  return theme==="auto" ? (prefersDark()?AUTO_DARK:AUTO_LIGHT) : theme;
}
function applyTheme(){
  const r=resolvedTheme();
  document.documentElement.setAttribute("data-theme",r);
  try{
    const bg=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    const m=document.querySelector('meta[name="theme-color"]');
    if(m&&bg) m.setAttribute("content",bg);
  }catch(e){}
}
try{
  matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change",()=>{ if(theme==="auto") applyTheme(); });
}catch(e){}

function sheetClick(e){
  const th=e.target.closest("button[data-theme]");
  if(th){ theme=th.dataset.theme; applyTheme(); saveState(); openSheet(); return; }
  const cl=e.target.closest("button[data-cal]");
  if(cl){ cal=cl.dataset.cal; saveState(); openSheet(); render(); return; }
  const ps=e.target.closest("button[data-ps]");
  if(ps){ userPS=+ps.dataset.ps; page=1; saveState(); openSheet(); render(); return; }
  const a=e.target.closest("button[data-act]");

/* ── إعادة حساب العدادات بعد أي تعديل ── */
function recount(){
  for(const k in COUNT) delete COUNT[k];
  D.forEach(d=>d.l.forEach(k=>COUNT[k]=(COUNT[k]||0)+1));
  Object.keys(DATA.CO).forEach(c=>{ const o=DATA.CO[c];
    o.n=D.filter(d=>d.l.some(k=>o.l.includes(k))).length; });
  DATA.YEARS.forEach(y=>{ const g=D.filter(d=>d.y===y.y);
    y.n=g.length; y.l=new Set(g.flatMap(d=>d.l)).size;
    y.o=new Set(g.flatMap(d=>d.o)).size; y.w=g.filter(d=>d.w).length;
    y.f=g.filter(d=>d.f).length; });
}

function exportFile(){
  const keep=d=>!DEL.has(d.p);
  const nd=JSON.parse(JSON.stringify(DATA));
  nd.D=nd.D.filter(keep); nd.ORGS=nd.ORGS.filter(keep);
  // إعادة حساب كل العدادات
  nd.counts={}; nd.D.forEach(d=>d.l.forEach(k=>nd.counts[k]=(nd.counts[k]||0)+1));
  Object.keys(nd.CO).forEach(c=>{const o=nd.CO[c];
    o.l=o.l.filter(k=>nd.counts[k]);
    o.n=nd.D.filter(d=>d.l.some(k=>o.l.includes(k))).length;
    if(!o.l.length||!o.n) delete nd.CO[c];});
  nd.CONT.forEach(c=>{c.co=c.co.filter(x=>nd.CO[x]);
    c.n=nd.D.filter(d=>c.co.some(x=>nd.CO[x].l.some(k=>d.l.includes(k)))).length;});
  nd.CONT=nd.CONT.filter(c=>c.co.length);
  nd.CITIES.forEach((c,i)=>c.n=nd.D.filter(d=>d.ci&&d.ci.includes(i)).length);
  nd.REG.forEach(r=>r.n=nd.D.filter(d=>d.ci&&d.ci.some(i=>r.c.includes(i))).length);
  const src=document.documentElement.outerHTML.replace(
    /\/\*<<DATA\*\/[\s\S]*?\/\*DATA>>\*\//,
    "/*<<DATA*/"+JSON.stringify(nd)+"/*DATA>>*/");
  const blob=new Blob(["<!DOCTYPE html>\n"+src],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="daleel-"+new Date().toISOString().slice(0,10)+".html";
  a.click(); URL.revokeObjectURL(a.href);
}

function countUp(){
  const red=matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("#spStats b").forEach(el=>{
    const to=+el.dataset.to;
    if(red){ el.textContent=to; return; }
    const t0=performance.now(), dur=1100;
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(to*e);
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

    view.innerHTML='<div class="head"><span class="t"><b>'+esc(ui==="ar"?c.ar:c.en)+'</b>'+
      '<span>'+t.orgIn(rows.length)+" \u00b7 "+t.socWord(c.s)+'</span></span></div>'+
      listBlock(rows, orgCard);
    return;
  }
  if(r.stage==="year"){
    const Y=(r.hj?DATA.YEARSH:DATA.YEARS).find(x=>x.y===r.y);
    let rows=D.map((d,i)=>[d,i]).filter(([d])=>(r.hj?d.yh:d.y)===r.y&&matches(d));
    if(filter) rows=rows.filter(([d])=>d.l.includes(filter));
        const lg=[...new Set(rows.flatMap(([d])=>d.l))].sort((a,b)=>COUNT[b]-COUNT[a]);
    $("ttl").textContent=(Y.y?yLab(Y.y):t.noDate); $("meta").textContent="";
    view.innerHTML='<div class="head"><span class="t"><b>'+(Y.y?yLab(Y.y)+t.yearOf:t.noDate)+'</b>'+
        '<span>'+t.cnt(Y.n)+'</span></span></div>'+
      '<div class="stats">'+
        '<div><b>'+Y.l+'</b><span>'+t.stLang+'</span></div>'+
        '<div><b>'+Y.o+'</b><span>'+t.stOrg+'</span></div>'+
        '<div><b>'+Y.w+'</b><span>'+t.stWomen+'</span></div>'+
        (EDIT?'<div><b>'+Y.f+'</b><span>'+t.stFlag+'</span></div>':'')+
      '</div>'+
      (lg.length>1?'<div class="lfilters">'+
        '<button class="lchip" data-lang="" aria-pressed="'+(!filter)+'">'+
          '<span class="lg">\u2727</span><span class="ln">'+t.all+'</span>'+
          '<span class="lc">'+Y.n+'</span></button>'+
        lg.map(k=>{const n=rows.filter(([d])=>d.l.includes(k)).length;
          return '<button class="lchip" data-lang="'+k+'" aria-pressed="'+(filter===k)+'">'+
            '<span class="lg">'+L[k].g+'</span><span class="ln">'+L[k][ui]+'</span>'+
            '<span class="lc">'+n+'</span></button>';}).join("")+'</div>':'')+
      listBlock(rows, ([d,i])=>chip(d,i));
    return;
  }

  /* ── منطقة ← مدنها ── */
  if(r.stage==="region"){
    const rg=DATA.REG.find(x=>x.id===r.id);
    $("ttl").textContent=rg[ui]; $("meta").textContent=t.cnt(rg.n);
    view.innerHTML='<div class="grid nat-grid enter">'+
      rg.c.map(i=>[DATA.CITIES[i],i]).sort((a,b)=>b[0].n-a[0].n).map(([c,i])=>
        '<button class="cell wide" type="button" data-city="'+i+'">'+
        '<span class="cn">'+esc(c[ui])+'</span>'+
        '<span class="cc">'+c.n+'</span></button>').join("")+'</div>';
    return;
  }

  /* ── مدينة واحدة ── */
  if(r.stage==="city"){
    const c=DATA.CITIES[r.i];
    let rows=D.map((d,i)=>[d,i]).filter(([d])=>d.ci.includes(r.i)&&matches(d));
        $("ttl").textContent=c[ui]; $("meta").textContent="";
    view.innerHTML='<div class="head"><span class="t"><b>'+esc(c[ui])+'</b>'+
      '<span>'+esc(DATA.REGIONS[c.r][ui==="ar"?0:1])+' · '+t.cnt(rows.length)+'</span></span></div>'+
      listBlock(rows, ([d,i])=>chip(d,i));
    return;
  }

  /* ── جنسية ← دعاتها ── */
  if(r.stage==="country"){
    const o=DATA.CO[r.code];
    let rows=D.map((d,i)=>[d,i]).filter(([d])=>d.l.some(k=>o.l.includes(k))&&matches(d));
    if(filter) rows=rows.filter(([d])=>d.l.includes(filter));
        $("ttl").textContent=o[ui]; $("meta").textContent="";
    view.innerHTML='<div class="head">'+
        '<span class="flag-row">'+flagHTML([o.fl])+'</span>'+
        '<span class="t"><b>'+o[ui]+'</b><span>'+o[ui==="ar"?"en":"ar"]+' · '+t.cnt(rows.length)+'</span></span></div>'+
      (o.l.length>1?'<div class="lfilters">'+
        '<button class="lchip" data-lang="" aria-pressed="'+(!filter)+'">'+
          '<span class="lg">\u2727</span><span class="ln">'+t.all+'</span>'+
          '<span class="lc">'+o.n+'</span></button>'+
        o.l.map(k=>{const n=D.filter(d=>d.l.includes(k)&&d.l.some(x=>o.l.includes(x))).length;
          return '<button class="lchip" data-lang="'+k+'" aria-pressed="'+(filter===k)+'">'+
            '<span class="lg">'+L[k].g+'</span>'+
            '<span class="ln">'+L[k][ui]+'</span>'+
            '<span class="lc">'+n+'</span></button>';}).join("")+'</div>':'')+
      listBlock(rows, ([d,i])=>chip(d,i));
    return;
  }

  $("ttl").textContent=t.title;
  if(q.trim()){
    const rows=D.map((d,i)=>[d,i]).filter(([d])=>matches(d));
    $("meta").textContent=t.res(rows.length);
    view.innerHTML=suggest()+listBlock(rows, ([d,i])=>chip(d,i));
    return;
  }
  const tab=r.tab||"lang";
  const fd = (r.stage==="home" && (r.tab||"lang")==="lang") ? finder() : "";
  const tabBar=fd+'<div class="tabs">'+
    [["lang","#/",t.tabNat],["city","#/regions",t.tabCity],["org","#/orgs",t.tabOrg],["year","#/years",t.tabYear],["res","#/res",t.tabRes]]
    .map(([id,h,lbl])=>'<button type="button" data-go="'+h+'" aria-pressed="'+(tab===id)+'">'+lbl+'</button>').join("")+
    '</div>';

  requestAnimationFrame(()=>{
    const on=document.querySelector('.tabs button[aria-pressed=true]');
    if(on&&on.scrollIntoView) on.scrollIntoView({inline:"center",block:"nearest"});
  });
  if(tab==="res"){
    const R=DATA.RES;
    $("meta").textContent=t.resNote;
    const secs=[["p",t.resPhones,R.phones.length],
                ["s",t.resSites,R.sites.length],
                ["n",t.resNamed,R.named.length]];
    let body="";
    if(resSec==="p"){
      body='<div class="rgrid">'+R.phones.map((x,i)=>
        '<div class="rtile">'+
        (EDIT?'<b class="pedit rt-ed" data-pi="'+i+'">\u270e</b>':'')+
        '<span class="rt-name">'+esc(ui==="ar"?x[1]:x[2])+'</span>'+
        '<span class="rt-num">'+fmt(x[0])+'</span>'+
        '<div class="rt-acts">'+
          '<a class="ib ib-call" href="tel:'+tel(x[0])+'" aria-label="'+t.call+'">'+svgCall+'</a>'+
          '<a class="ib ib-wa" href="https://wa.me/'+wa(x[0])+'" target="_blank" rel="noopener" '+
            'aria-label="'+t.wa+'">'+svgWa+'</a>'+
        '</div></div>').join("")+'</div>'+
        (EDIT?'<button class="sbtn addbtn" data-add="p">'+t.addPhone+'</button>':'');
    } else if(resSec==="s"){
      body='<div class="srows">'+R.sites.map((x,i)=>
        '<a class="srow" href="https://'+x[0]+'" target="_blank" rel="noopener">'+
        '<span class="s-nm">'+esc(ui==="ar"?x[1]:x[2])+'</span>'+
        '<span class="s-url">'+esc(x[0])+'</span>'+
        (EDIT?'<b class="pedit" data-si="'+i+'">\u270e</b>':'')+'</a>').join("")+'</div>'+
        (EDIT?'<button class="sbtn addbtn" data-add="s">'+t.addSite+'</button>':'');
    } else {
      const linked=R.named.filter(x=>x[3]).length;
      body='<p class="pnote">'+(linked?t.viaBooks2(linked,R.named.length):t.viaBooks)+'</p>'+
        '<div class="pills">'+R.named.map((x,i)=>{
          const nm=esc(ui==="ar"?x[0]:x[1]),
                kd='<i>'+esc(resKind(x[2]).replace(/ \u2014.*/,""))+'</i>',
                ed=EDIT?'<b class="pedit" data-ri="'+i+'">'+(x[3]?"\u270e":"+")+'</b>':'';
          return x[3]
            ? '<a class="pill has" href="'+esc(x[3])+'" target="_blank" rel="noopener">'+nm+kd+ed+'</a>'
            : '<span class="pill">'+nm+kd+ed+'</span>';
        }).join("")+'</div>'+
        (EDIT?'<button class="sbtn addbtn" data-add="n">'+t.addItem+'</button>':'');
    }
    view.innerHTML=tabBar+
      '<div class="segs rsegs">'+secs.map(s=>
        '<button class="seg'+(resSec===s[0]?" on":"")+'" data-rs="'+s[0]+'">'+
        esc(s[1])+' <b>'+s[2]+'</b></button>').join("")+'</div>'+body;
    return;
  }
  if(tab==="org"){
    if(q.trim()){
      const rows=ORGS.filter(o=>norm(o[ui]+" "+o.p).includes(norm(q))||o.p.includes(q.replace(/\D/g,"")));
      $("meta").textContent=t.orgCount(rows.length);
      view.innerHTML=tabBar+listBlock(rows, orgCard);
      return;
    }
    $("meta").textContent=t.homeOrg;
    view.innerHTML=tabBar+'<div class="grid nat-grid enter">'+DATA.ORGC.map((c,i)=>
      '<button class="cell wide" type="button" data-oc="'+i+'">'+
        '<span class="cn">'+esc(ui==="ar"?c.ar:c.en)+'</span>'+
        '<span class="sub">'+t.socWord(c.s)+'</span>'+
        '<span class="cc">'+c.n+'</span></button>').join("")+'</div>';
    return;
  }
  if(tab==="year"){
    $("meta").textContent=t.homeYear;
    const now=new Date().getFullYear();
    view.innerHTML=tabBar+'<div class="grid nat-grid enter">'+YRS().map(y=>
      '<button class="cell yr'+(y.y&&y.g<=now-2?" stale":"")+'" type="button" data-y="'+yKey(y.y)+'">'+
        '<span class="cc">'+y.n+'</span>'+
        '<span class="ynum">'+(y.y?yLab(y.y):"—")+'</span>'+
        '<span class="sub">'+y.l+' '+t.stLang+'</span></button>').join("")+'</div>'+
      (EDIT?'<button class="link" type="button" id="toAdmin">'+t.adminLink+'</button>':'');
    return;
  }
  if(tab==="city"){
    $("meta").textContent=t.homeReg;
    view.innerHTML=tabBar+'<div class="grid nat-grid enter">'+DATA.REG.map(rg=>
      '<button class="cell wide" type="button" data-reg="'+rg.id+'">'+
        '<span class="cn">'+esc(rg[ui])+'</span>'+
        '<span class="sub">'+rg.c.length+' '+t.citiesWord+'</span>'+
        '<span class="cc">'+rg.n+'</span></button>').join("")+'</div>'+
      (EDIT?'<button class="link" type="button" id="toAdmin">'+t.adminLink+'</button>':'');
    return;
  }
  if(fdActive()){
    const rows=D.map((d,i)=>[d,i]).filter(([d])=>fdMatch(d));
    $("meta").textContent=t.res(rows.length);
    view.innerHTML=tabBar+listBlock(rows, ([d,i])=>chip(d,i));
    return;
  }
  $("meta").textContent=t.homeNat;
  const NAT=Object.entries(DATA.CO).sort((a,b)=>b[1].n-a[1].n);
  const NPAGE=Math.ceil(NAT.length/2);              // صفحتان دائماً
  const pages=Math.ceil(NAT.length/NPAGE);
  if(page>pages) page=1;
  const slice=NAT.slice((page-1)*NPAGE, page*NPAGE);
  const np=pages<2?"":'<div class="pgs">'+
    Array.from({length:pages},(_,k)=>
      '<button class="pg'+(k+1===page?" on":"")+'" data-pg="'+(k+1)+'">'+(k+1)+'</button>'
    ).join("")+'</div>';
  view.innerHTML=tabBar+np+'<div class="grid nat-grid enter">'+slice.map(([code,o])=>
    '<button class="cell" type="button" data-co="'+code+'">'+
      '<span class="cf">'+flagHTML([o.fl])+'</span>'+
      '<span class="cn">'+o[ui]+'</span>'+
      '<span class="cc">'+o.n+'</span></button>').join("")+'</div>'+np+
    (EDIT?'<button class="link" type="button" id="toAdmin">'+t.adminLink+'</button>':'');
}

$("view").addEventListener("click",e=>{
  const pg=e.target.closest("[data-pg]");
  if(pg){ page=+pg.dataset.pg; render(); scrollTo({top:0,behavior:"instant"}); return; }
  const x=e.target.closest("[data-del]");
  if(x){ e.stopPropagation(); const p=x.dataset.del;
         DEL.has(p)?DEL.delete(p):DEL.add(p); render(); return; }
  const nav=e.target.closest("[data-go]");
  if(nav){ q=""; $("q").value=""; go(nav.dataset.go); return; }
  const rg=e.target.closest("[data-reg]");
  if(rg){ go("#/reg/"+rg.dataset.reg); return; }
  const clean=u=>{ u=(u||"").trim().replace(/^https?:\/\//,""); return u; };
  const pe=e.target.closest(".pedit");
  if(pe){
    e.preventDefault(); e.stopPropagation();
    const t2=T[ui];
    if(pe.dataset.pi!==undefined){
      const i=+pe.dataset.pi, it=DATA.RES.phones[i];
      const nm=prompt(t2.askName, ui==="ar"?it[1]:it[2]);
      if(nm===null) return;
      if(!nm.trim()){
        if(confirm(t2.confirmDel)){ DATA.RES.phones.splice(i,1); render(); }
        return;
      }
      const ph=prompt(t2.askPhone, it[0]);
      if(ph===null) return;
      const p=normPhone(ph);
      if(!p){ alert(t2.badPhone); return; }
      const ds=prompt(t2.askDesc, it[3]||"");
      if(ui==="ar") it[1]=nm.trim(); else it[2]=nm.trim();
      it[0]=p; it[3]=(ds||"").trim()||undefined;
      render(); return;
    }
    if(pe.dataset.ri!==undefined){
      const it=DATA.RES.named[+pe.dataset.ri];
      const v=prompt(t2.askUrl+"\n"+(ui==="ar"?it[0]:it[1]), it[3]||"https://");
      if(v!==null){ const u=clean(v); it[3]=u?"https://"+u:undefined; render(); }
    } else {
      const it=DATA.RES.sites[+pe.dataset.si];
      const v=prompt(t2.askUrl+"\n"+(ui==="ar"?it[1]:it[2]), it[0]);
      if(v!==null){ const u=clean(v); if(u){ it[0]=u; render(); } }
    }
    return;
  }
  const ab=e.target.closest("[data-add]");
  if(ab){
    const t2=T[ui], kind=ab.dataset.add;
    const nm=prompt(t2.askName); if(!nm||!nm.trim()) return;
    const ur=prompt(t2.askUrl, "https://");
    const u=clean(ur);
    if(kind==="p"){
      const ph=prompt(t2.askPhone, "05");
      const p=normPhone(ph);
      if(!p){ alert(t2.badPhone); return; }
      const ds=prompt(t2.askDesc, "");
      DATA.RES.phones.push([p, nm.trim(), nm.trim(), (ds||"").trim()||undefined]);
      render(); return;
    }
    if(kind==="s"){
      if(!u){ alert(t2.needUrl); return; }
      DATA.RES.sites.push([u, nm.trim(), nm.trim()]);
    } else {
      const it=[nm.trim(), nm.trim(), ui==="ar"?"\u0645\u0648\u0642\u0639":"\u0645\u0648\u0642\u0639"];
      if(u) it.push("https://"+u);
      DATA.RES.named.push(it);
    }
    render(); return;
  }
  const ad=e.target.closest("[data-adopt]");
  if(ad){
    e.preventDefault();
    const d=D[+ad.dataset.adopt], t2=T[ui];
    if(!confirm(t2.adoptAsk(fmt(d.p), fmt(d.fa)))) return;
    const old=d.p;
    d.p=d.fa; delete d.fa;
    d.f=(d.f||"")+" \u2014 "+t2.adopted(fmt(old));
    if(d.fe) d.fe=d.fe+" \u2014 adopted, replacing "+fmt(old);
    d.fk="fixed";
    render(); return;
  }
  if(e.target.closest("#setReport")){
    const t2=T[ui];
    const v=prompt(t2.askReport, DATA.REPORT||"05");
    if(v!==null){
      const p=normPhone(v);
      if(!p && v.trim()){ alert(t2.badPhone); return; }
      DATA.REPORT = p || "";
      const sh=$("sheet"); if(sh&&sh.classList.contains("open")) openSheet();
      render();
    }
    return;
  }
  if(e.target.closest("#toFlags")){ closeSheet(); go("#/flags"); return; }
  if(e.target.closest("#revToggle")){
    const u=new URL(location.href);
    if(EDIT) u.searchParams.delete("edit"); else u.searchParams.set("edit","1");
    location.href=u.toString(); return;
  }
  const fs=e.target.closest("[data-fslot]");
  if(fs){
    const k=fs.dataset.fslot; page=1;
    if(k==="women"){ fWomen=!fWomen; fOpen=""; }
    else if(k==="clear"){ fNat=""; fCity=-1; fWomen=false; fOpen=""; }
    else fOpen = fOpen===k ? "" : k;
    render(); return;
  }
  const fn=e.target.closest("[data-fnat]");
  if(fn){ fNat=fn.dataset.fnat; fOpen=""; page=1; render(); return; }
  const fc=e.target.closest("[data-fcity]");
  if(fc){ fCity=+fc.dataset.fcity; fOpen=""; page=1; render(); return; }
  const rs=e.target.closest("button[data-rs]");
  if(rs){ resSec=rs.dataset.rs; render(); return; }
  const ocb=e.target.closest("[data-oc]");
  if(ocb){ q=""; $("q").value=""; page=1; go("#/oc/"+ocb.dataset.oc); return; }
  const yb=e.target.closest("[data-y]");
  if(yb){ q=""; $("q").value=""; filter=null; page=1; go("#/y/"+yb.dataset.y); return; }
  const ct=e.target.closest("[data-city]");
  if(ct){ q=""; $("q").value=""; page=1; go("#/city/"+ct.dataset.city); return; }
  const cn=e.target.closest("[data-cn]");
  if(cn){ go("#/cn/"+cn.dataset.cn); return; }
  const co=e.target.closest("[data-co]");
  if(co){ filter=null; page=1; go("#/co/"+co.dataset.co); return; }
  const lf=e.target.closest("[data-lang]");
  if(lf){ filter=lf.dataset.lang||null; page=1; render(); return; }
  const f=e.target.closest(".fchip");
  if(f){ filter=f.dataset.o||null; page=1; render(); return; }
  const tile=e.target.closest(".tile");
  if(tile){ q=""; $("q").value=""; filter=null; page=1; go("#/l/"+tile.dataset.k); return; }
  const c=e.target.closest(".chip");
  if(c){ go("#/p/"+c.dataset.i); return; }

  
  if(e.target.closest("#toAdmin")) go("#/admin");
});
$("back").addEventListener("click",()=>history.back());
$("q").addEventListener("input",e=>{q=e.target.value;page=1;render();});
$("langBtn").addEventListener("click",()=>{
  ui = ui==="ar" ? "en" : "ar"; saveState(); render();
});
addEventListener("hashchange",()=>{filter=null;page=1;render();scrollTo({top:0});});
applyTheme();
$("gear").addEventListener("click",openSheet);
$("flagsBtn").addEventListener("click",()=>go("#/flags"));
$("spEnter").addEventListener("click",()=>{ document.body.dataset.splash="0"; });
$("spShare").addEventListener("click",shareWa);
buildEditBar();
render();
</script>
</body>
</html>
